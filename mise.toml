[tools]
rust = "1.97.1"
jq = "1.8.2" # release tasks
zig = "0.15.2" # cross-compile linker (mise run release)
"github:rust-cross/cargo-zigbuild" = "0.23.4"

[env]
AWS_REGION = "us-east-2"
# Release artifacts (mise run publish / latest); see .mise/tasks.
ARTIFACTS_BUCKET = "com.integralthread.artifacts"
ARTIFACTS_PROFILE = "{{ get_env(name='ARTIFACTS_PROFILE', default='it-admin-delta') }}"

# Release tasks (ci, publish, release, latest) live as scripts under .mise/tasks/.

[tasks.check]
description = "Type-check all targets and features"
run = "cargo check --all-targets --all-features"

[tasks.test]
description = "Run the test suite"
run = "cargo test --all-features"

[tasks.fmt]
description = "Format Rust sources"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check Rust source formatting"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Run Clippy with warnings denied"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[hooks]
postinstall = "hk install --mise"
